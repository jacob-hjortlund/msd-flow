defaults:
  - /data/transforms@transforms: arcsinh
  - _self_

data_dir: null
cache_dir: null

num_workers: 8
prefetch_factor: 2
persistent_workers: true
multiprocessing_context: spawn

augmentations:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: msdflow.data.preprocess.RandomHorizontalFlip
      p: 0.5
    - _target_: msdflow.data.preprocess.RandomVerticalFlip
      p: 0.5
    - _target_: msdflow.data.preprocess.RandomRotation90

metadata_columns: ${metadata_columns}
metadata_transform:
  _target_: torchvision.transforms.Compose
  transforms:
    - _target_: msdflow.data.preprocess.GlobalNorm
      _partial_: true
      global_min: 0.0994
      global_max: 0.4
      norm_min: -1.0
      norm_max: 1.0
dataset_class: msdflow.data.dataset.TNG50Dataset

max_size: null

train_dataset:
  _target_: ${data.dataloader.dataset_class}
  _partial_: true
  processed_dir: ${data.dataloader.data_dir}
  split: train
  image_transform:
    _target_: torchvision.transforms.Compose
    transforms:
      - ${data.dataloader.transforms.deterministic}
      - ${data.dataloader.augmentations}
  metadata_columns: ${data.dataloader.metadata_columns}
  metadata_transform: ${data.dataloader.metadata_transform}
  max_size: ${data.dataloader.max_size}

val_dataset:
  _target_: ${data.dataloader.dataset_class}
  _partial_: true
  processed_dir: ${data.dataloader.data_dir}
  split: val
  image_transform: ${data.dataloader.transforms.deterministic}
  metadata_columns: ${data.dataloader.metadata_columns}
  metadata_transform: ${data.dataloader.metadata_transform}
  max_size: ${data.dataloader.max_size}

test_dataset:
  _target_: ${data.dataloader.dataset_class}
  processed_dir: ${data.dataloader.data_dir}
  _partial_: true
  split: test
  image_transform: ${data.dataloader.transforms.deterministic}
  metadata_columns: ${data.dataloader.metadata_columns}
  metadata_transform: ${data.dataloader.metadata_transform}
  max_size: ${data.dataloader.max_size}


batch_size: 8
val_batch_size: 16
train:
  dataset: ${data.dataloader.train_dataset}
  batch_size: ${data.dataloader.batch_size}
  shuffle: true
  drop_last: true
  num_workers: ${data.dataloader.num_workers}
  prefetch_factor: ${data.dataloader.prefetch_factor}
  persistent_workers: ${data.dataloader.persistent_workers}
  multiprocessing_context: ${data.dataloader.multiprocessing_context}

eval_train:
  dataset: ${data.dataloader.train_dataset}
  batch_size: ${data.dataloader.val_batch_size}
  shuffle: true
  drop_last: true
  num_workers: ${data.dataloader.num_workers}
  prefetch_factor: ${data.dataloader.prefetch_factor}
  persistent_workers: ${data.dataloader.persistent_workers}
  multiprocessing_context: ${data.dataloader.multiprocessing_context}

val:
  dataset: ${data.dataloader.val_dataset}
  batch_size: ${data.dataloader.val_batch_size}
  shuffle: false
  drop_last: true
  num_workers: ${data.dataloader.num_workers}
  prefetch_factor: ${data.dataloader.prefetch_factor}
  persistent_workers: ${data.dataloader.persistent_workers}
  multiprocessing_context: ${data.dataloader.multiprocessing_context}

test:
  dataset: ${data.dataloader.test_dataset}
  batch_size: ${data.dataloader.batch_size}
  shuffle: false
  drop_last: true
  num_workers: ${data.dataloader.num_workers}
  prefetch_factor: ${data.dataloader.prefetch_factor}
  persistent_workers: ${data.dataloader.persistent_workers}
  multiprocessing_context: ${data.dataloader.multiprocessing_context}