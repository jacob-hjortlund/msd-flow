name: python-env
channels:
  - conda-forge
dependencies:
  - python <=3.12
  - jupyter
  - notebook
  - numpy < 2.0.0
  - matplotlib
  - seaborn
  - scipy
  - pandas  
  - pip
  - tqdm
  - pytorch
  - torchvision
  - astropy
  - h5py
  - pip:
    - jax
    - equinox
    - optax
    - diffrax
    - caustics
    - hydra-core
